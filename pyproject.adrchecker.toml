# ============================================================================
# adrchecker — Standalone ADR quality checker sub-project
# ============================================================================
#
# This is a SEPARATE pyproject.toml for the `adrchecker` package, which lives
# at `src/adrchecker/` as a sibling of `src/adrminer/`.
#
# To install ONLY the checker (without the full adrminer stack):
#   pip install -e . --config-settings pyproject.toml=pyproject.adrchecker.toml
#
# Or build it separately:
#   python -m build --config-setting pyproject.toml=pyproject.adrchecker.toml
#
# Note: Because the main pyproject.toml already exists, the recommended way to
# install adrchecker standalone is to copy this file to a temp location or use:
#   pip install -e "src/adrchecker/"
# with a minimal setup. See README.adrchecker.md for details.
# ============================================================================

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adrchecker"
version = "0.1.0"
description = "Standalone service for checking Architectural Decision Record (ADR) quality"
readme = "README.adrchecker.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "ADRminer Team", email = "adrminer@example.com"}
]
keywords = [
    "adr",
    "architecture-decision-records",
    "quality",
    "madr",
    "llm",
    "checking",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.1.0",
    "tiktoken>=0.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/tommantonela/ADRminer"
Repository = "https://github.com/tommantonela/ADRminer"

[project.scripts]
adrchecker = "adrchecker.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["adrchecker*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--verbose"]