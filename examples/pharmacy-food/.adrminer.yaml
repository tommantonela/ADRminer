# ADRminer Default Configuration
# This file provides default settings for ADRminer
# Copy to ~/.adrminer.yaml and customize as needed

# LLM Configuration
llm:
  provider: openai  # openai, anthropic, ollama, azure, google, groq
  model: gpt-4.1-mini #llama-3.3-70b-versatile # gpt-4.1-mini # phi4-mini-reasoning:latest
  temperature: 0.0
  max_tokens: 2000
  max_input_tokens: 500000  # Model context window size (used by SummarizationMiddleware)
  ollama_base_url: http://localhost:11434

# Topic Model Configuration
topic_model:
  path: ./models/saved_topicmodel
  embedding_model: all-MiniLM-L6-v2
  n_topics: null
  use_llm_representation: true  # Use LLM to generate human-readable topic names

# Classification Configuration
classification:
  framework: kruchten  # kruchten, quality_attributes, zimmermann
  examples: ./few-shots/kruchten_examples.json
  use_examples: true
  use_parser: true  # Enable ADR parser for section extraction
  parser:
    strict: false  # Lenient mode: fallback to full-text on errors
    detect_language: true  # Detect ADR language using langdetect
    fallback_on_error: true  # Fallback to original text on parsing failure

# Check Service Configuration
check:
  template: madr
  use_parser: true  # Enable ADR parser for section extraction
  parser:
    strict: false  # Lenient mode: fallback to full-text on errors
    detect_language: true  # Detect ADR language using langdetect
    fallback_on_error: true  # Fallback to original text on parsing failure

# Agent Configuration
agent:
  agent_enabled: true
  middleware:
    summarization_trigger_fraction: 0.8  # Fraction of context window that triggers summarization
    summarization_trigger_messages: 30   # Max messages before triggering summarization
    summarization_keep_fraction: 0.3     # Fraction of context to keep after summarization

# Output Configuration
output:
  format: json-sidecar  # json-sidecar, consolidated-json, markdown
  parallel: true
  verbose: false
